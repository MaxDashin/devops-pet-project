services:
  app:
    build: ./app
    ports: ["8000:8000"]
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/tododb
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: tododb
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
